<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150" viewBox="0 0 240 150" role="img" aria-labelledby="title desc">
  <title id="title">Length-three repetition seed check graph</title>
  <desc id="desc">Three variable nodes v0, v1, v2 and two checks c0, c1. The edges are v0-c0, v1-c0, v1-c1, and v2-c1.</desc>
  <rect width="240" height="150" fill="white"/>
  <g stroke="#455a64" stroke-width="2" fill="none">
    <line x1="40" y1="35" x2="80" y2="105"/>
    <line x1="120" y1="35" x2="80" y2="105"/>
    <line x1="120" y1="35" x2="160" y2="105"/>
    <line x1="200" y1="35" x2="160" y2="105"/>
  </g>
  <g fill="#e3f2fd" stroke="#1565c0" stroke-width="2">
    <circle cx="40" cy="35" r="16"/>
    <circle cx="120" cy="35" r="16"/>
    <circle cx="200" cy="35" r="16"/>
  </g>
  <g fill="#fff3e0" stroke="#ef6c00" stroke-width="2">
    <rect x="65" y="90" width="30" height="30"/>
    <rect x="145" y="90" width="30" height="30"/>
  </g>
  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#17252a">
    <text x="40" y="40">v0</text>
    <text x="120" y="40">v1</text>
    <text x="200" y="40">v2</text>
    <text x="80" y="110">c0</text>
    <text x="160" y="110">c1</text>
  </g>
</svg>
