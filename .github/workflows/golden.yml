name: Pinned arXiv replay

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: build/golden-archives
          key: arxiv-${{ hashFiles('tests/golden/arxiv_sources.json') }}
      - run: python -m pip install .
      - name: Download and verify pinned archive bytes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import time
          import urllib.request
          root = Path('build/golden-archives')
          root.mkdir(parents=True, exist_ok=True)
          for case in json.loads(Path('tests/golden/arxiv_sources.json').read_text()):
              target = root / case['archive_sha256']
              if target.exists():
                  raw = target.read_bytes()
              else:
                  with urllib.request.urlopen(case['source_url'], timeout=120) as response:
                      raw = response.read((32 << 20) + 1)
                  time.sleep(3)
              if len(raw) > 32 << 20 or hashlib.sha256(raw).hexdigest() != case['archive_sha256']:
                  raise ValueError('Pinned archive mismatch: ' + case['arxiv'])
              target.write_bytes(raw)
          PY
      - run: python tools/reproduce_golden.py --archive-dir build/golden-archives --out build/golden-results.json
