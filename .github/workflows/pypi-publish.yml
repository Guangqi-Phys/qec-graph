name: Publish an existing release to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub Release tag to upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Fetch and verify the published distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.]*$ ]]
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          version="${RELEASE_TAG#v}"
          wheel="qec_graph-$version-py3-none-any.whl"
          sdist="qec_graph-$version.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "$wheel" --pattern "$sdist" --pattern qec-graph-python.sha256
          cd dist
          test "$(sha256sum "$wheel" "$sdist")" = "$(cat qec-graph-python.sha256)"
          mv qec-graph-python.sha256 ../
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
