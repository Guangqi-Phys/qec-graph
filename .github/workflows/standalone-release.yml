name: Standalone Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: standalone-release-${{ github.ref }}

jobs:
  build:
    name: Build and verify (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: darwin-arm64
          - runner: macos-15-intel
            arch: x86_64
            target: darwin-x86_64
          - runner: ubuntu-22.04
            arch: x86_64
            target: linux-x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            target: linux-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build standalone executable
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$RELEASE_ARCH"
          python -m pip install . 'PyInstaller==6.22.3'
          version="$(python -c 'from importlib.metadata import version; print(version("qec-graph"))')"
          test "$GITHUB_REF_NAME" = "v$version"
          python -m PyInstaller --distpath dist/standalone --workpath build/standalone tools/qec-graph.spec
          test "$(dist/standalone/qec-graph --version)" = "qec-graph $version"
          if [ "$RUNNER_OS" = macOS ]; then
            file dist/standalone/qec-graph | grep -F "$RELEASE_ARCH"
            codesign --verify dist/standalone/qec-graph
          fi
      - name: Verify the packaged CLI
        run: |
          sh -n install.sh
          python tools/reproduce_workspace.py --bin-dir dist/standalone --out build/standalone/report.json
      - name: Generate release assets
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/release
          asset="qec-graph-$RELEASE_TARGET"
          cp dist/standalone/qec-graph "dist/release/$asset"
          cd dist/release
          if [ "$RUNNER_OS" = Linux ]; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qec-graph-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error

  python-dist:
    name: Build and verify Python distributions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Verify version, metadata, and installed wheel
        run: |
          python -m pip install 'pip>=25.1'
          python -m pip install --group dev .
          version="$(python -c 'from importlib.metadata import version; print(version("qec-graph"))')"
          test "$GITHUB_REF_NAME" = "v$version"
          python -m build --no-isolation --outdir dist/python
          python -m twine check --strict dist/python/*
          python tools/check_distribution.py dist/python
          python -m pip install --force-reinstall --no-deps dist/python/*.whl
          python tools/reproduce_workspace.py --bin-dir "$(dirname "$(command -v python)")" --out build/release/python-workspace.json
          cd dist/python
          sha256sum qec_graph-*.whl qec_graph-*.tar.gz > qec-graph-python.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/python/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, python-dist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: qec-graph-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions
          path: dist/release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cd dist/release
          sha256sum -c qec-graph-darwin-{arm64,x86_64}.sha256 qec-graph-linux-{arm64,x86_64}.sha256
          sha256sum -c qec-graph-python.sha256
          repo="$GITHUB_REPOSITORY"
          tag="$GITHUB_REF_NAME"
          draft="$(gh release view "$tag" --repo "$repo" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = false ]; then
            echo "Release $tag is already published."
            exit 0
          fi
          if [ "$draft" != true ]; then
            prerelease=()
            if [[ "$tag" =~ (a|b|rc)[0-9]+$ ]]; then prerelease=(--prerelease); fi
            {
              printf '%s\n\n' 'Standalone builds tested on macOS 15 and Ubuntu 22.04 (glibc 2.35), each on arm64 and x86_64.'
              printf '%s\n\n' 'Python wheel and source distribution were checked against the tagged README, version, license, and schemas.'
              printf '%s\n\n' 'Run the same command to install or update to the latest GitHub Release.'
              printf '%s\n' '```sh'
              printf 'curl -fsSL https://raw.githubusercontent.com/%s/%s/install.sh | sh\n' "$repo" "$DEFAULT_BRANCH"
              printf '%s\n\n' '```'
              printf '%s\n' 'Open a new terminal if the installer added the command to your PATH. In each new workspace, run `qec-graph init --workspace .` once, then place paper archives in `inputs/` and run `qec-graph sync`.'
            } > release-notes.md
            gh release create "$tag" --repo "$repo" --verify-tag --draft "${prerelease[@]}" \
              --title "QEC Graph $tag for macOS and Linux" --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$repo" --clobber ../../install.sh \
            qec-graph-darwin-arm64 qec-graph-darwin-arm64.sha256 \
            qec-graph-darwin-x86_64 qec-graph-darwin-x86_64.sha256 \
            qec-graph-linux-arm64 qec-graph-linux-arm64.sha256 \
            qec-graph-linux-x86_64 qec-graph-linux-x86_64.sha256 \
            qec_graph-*.whl qec_graph-*.tar.gz qec-graph-python.sha256
          gh release edit "$tag" --repo "$repo" --draft=false
