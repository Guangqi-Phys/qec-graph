name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        os: [ubuntu-22.04, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and development tools
        run: |
          python -m pip install 'pip>=25.1'
          python -m pip install --group dev -e .
      - name: Lint
        run: python -m ruff check qecgraph tests tools
      - name: Prevent new complexity debt
        run: python tools/check_complexity.py
      - name: Type-check with mypy
        run: python -m mypy
      - name: Type-check with pyright (advisory warnings)
        run: python -m pyright
      - name: Run all tests with branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml
      - name: Reproduce the end-to-end workflow
        run: python tools/reproduce.py --out build/reproduce
      - name: Lint Markdown
        if: matrix.os == 'ubuntu-22.04' && matrix.python == '3.13'
        run: npx --yes markdownlint-cli2@0.20.0

  isolated-tex:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      QECGRAPH_TEST_TEX: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install TeX Live and bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap poppler-utils texlive-latex-extra texlive-publishers texlive-fonts-recommended
          python -m pip install -e .
      - name: Verify isolated native compilation
        run: python -m unittest tests.integration.pipeline.test_compilation_sandbox tests.integration.pipeline.test_compilation -v

  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify the installed entrypoint and research profile
        run: |
          mkdir -p build/container
          export QEC_UID="$(id -u)" QEC_GID="$(id -g)"
          docker compose build research
          docker compose run --rm research --version
          docker compose run --rm research
          test -f build/container/CURRENT.json
