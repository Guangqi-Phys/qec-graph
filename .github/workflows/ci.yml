name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.11'
          - os: macos-15
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and development tools
        run: |
          python -m pip install 'pip>=25.1'
          python -m pip install --group dev -e .
      - name: Check lint and types
        run: |
          python -m ruff check qecgraph tests tools
          python -m mypy
      - name: Run tests with branch coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report
      - name: Replay the bundled source and graph pipeline
        run: python tools/reproduce.py --out build/ci/reproduce
      - name: Build and verify distributions
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*
          python tools/check_distribution.py dist
      - name: Verify the installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python tools/reproduce_workspace.py --bin-dir "$(dirname "$(command -v python)")" --out build/ci/workspace.json
      - name: Verify the Linux MCP isolation profile
        if: runner.os == 'Linux'
        run: python tools/reproduce_linux_isolation.py --out build/ci/linux-isolation.json
      - name: Verify the macOS MCP isolation profile
        if: runner.os == 'macOS'
        run: |
          python -m venv "$RUNNER_TEMP/qec-mcp-venv"
          "$RUNNER_TEMP/qec-mcp-venv/bin/python" -m pip install dist/*.whl
          python tools/reproduce_isolation.py --python "$RUNNER_TEMP/qec-mcp-venv/bin/python" --out build/ci/macos-isolation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workspace-verification-${{ matrix.os }}-${{ matrix.python }}
          path: |
            build/ci/*.json
            build/ci/reproduce/results.json
          if-no-files-found: error
