# Markdown structure/style checks for the current documentation tree.
# Line length and table-pipe spacing are intentionally off: the guides contain
# long URLs, Chinese prose and compact tables that read better without wrapping.
config:
  MD013: false
  MD028: false
  MD060: false
globs:
  - "docs/**/*.md"
  - "README.md"
  - "README.zh-CN.md"
  - "CONTRIBUTING.md"
  - "SECURITY.md"
  - "CHANGELOG.md"
  - "AGENTS.md"
ignores:
  # Preserve the author's requirements and dated review as supplied.
  - "docs/design/Human.md"
  - "docs/reviews/review-2026-11-12/REVIEW-2026-11-12.zh-CN.md"
  - "legacy/**"
  - "validation/**"
