repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: python -m ruff check qecgraph tests tools
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        files: ^(qecgraph/.*\.py|pyproject\.toml)$
        pass_filenames: false
