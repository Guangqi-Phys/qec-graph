[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-graph"
version = "0.2.0"
description = "Provenance-preserving LaTeX blocks and typed QEC knowledge graphs"
requires-python = ">=3.11"
dependencies = ["pylatexenc==2.10"]

[project.scripts]
qecgraph = "qecgraph.cli:main"
qec-graph = "qecgraph.cli:main"
qec-latex-split = "qecgraph.splitter:main"

[tool.setuptools.packages.find]
include = ["qecgraph*"]
