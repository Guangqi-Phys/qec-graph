[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-graph"
dynamic = ["version"]
description = "Provenance-preserving LaTeX blocks and typed QEC knowledge graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pylatexenc==2.10", "jsonschema==4.26.0"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "QEC Graph contributors"}]
keywords = ["quantum error correction", "LaTeX", "knowledge graph", "MCP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/Guangqi-Phys/qec-graph"
Documentation = "https://github.com/Guangqi-Phys/qec-graph/blob/main/docs/user/advanced-usage.md"
Issues = "https://github.com/Guangqi-Phys/qec-graph/issues"
Changelog = "https://github.com/Guangqi-Phys/qec-graph/blob/main/CHANGELOG.md"

[project.scripts]
qecgraph = "qecgraph.cli:main"
qec-graph = "qecgraph.cli:main"
qec-latex-split = "qecgraph.splitter:main"
qecgraph-mcp = "qecgraph.mcp_server:main"

[dependency-groups]
dev = [
    "build==1.6.1",
    "coverage==7.17.2",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "ruff==0.17.4",
    "setuptools==84.2.1",
    "twine==7.0.0",
]

[tool.setuptools.packages.find]
include = ["qecgraph*"]

[tool.setuptools.dynamic]
version = {attr = "qecgraph.__version__"}

[tool.setuptools.package-data]
"qecgraph" = ["catalog/*.json"]
"qecgraph.validators" = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["qecgraph"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "pylatexenc", "pylatexenc.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["qecgraph"]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
